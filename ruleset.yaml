# Generated by "go generate ./..." from the rule catalogue. Do not edit by hand.
#
# Every rule needs the vacuum plugin that provides its custom function:
#
#   go build -buildmode=plugin -o extra.so ./plugin
#   vacuum lint -r ruleset.yaml -f ./dir-containing-extra-so openapi.yaml
#
# Every rule sets resolved: false. vacuum resolves $ref pointers in place unless
# a rule says otherwise, and the rules of this catalogue read the $ref nodes
# themselves, so they must see the document as written.
#
# Rules that need configuration to do anything (for example a list of banned
# words) are inert until their functionOptions are filled in.

description: Extra rules for the vacuum OpenAPI linter.
rules:
  extra-action-verbs-in-path:
    description: Path segments must be nouns, not action verbs such as create or delete.
    message: "{{error}}"
    howToFix: Rename the path segment to a noun and let the HTTP method express the action.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-action-verbs-in-path
      functionOptions:
        verbs:
          - get
          - create
          - update
          - delete
          - fetch
          - remove
          - add
          - set
          - find
          - search
          - make
          - do
          - run
          - execute
          - process
          - handle
          - list
          - post
          - put
  extra-additional-properties-object-only:
    description: additionalProperties is only valid inside object schemas.
    message: "{{error}}"
    howToFix: Remove additionalProperties or change the schema type to object.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-additional-properties-object-only
      functionOptions: {}
  extra-admin-security-differs:
    description: Admin endpoints must not share a security requirement with non-admin endpoints.
    message: "{{error}}"
    howToFix: Give admin operations a dedicated security scheme or scope that no non-admin operation uses.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-admin-security-differs
      functionOptions:
        adminUrl: /admin
  extra-allof-schema-type-intersection:
    description: A schema and its immediate allOf branches must declare types with a non-empty intersection.
    message: "{{error}}"
    howToFix: Make the types of the schema and of its allOf branches compatible, or remove the conflicting branch.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-allof-schema-type-intersection
      functionOptions: {}
  extra-allow-reserved-query-only:
    description: allowReserved must only be set on query parameters.
    message: "{{error}}"
    howToFix: Remove allowReserved from the parameter or header, or move the parameter to the query string.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-allow-reserved-query-only
      functionOptions: {}
  extra-api-max-operations:
    description: The document must not define more operations than the configured limit.
    message: "{{error}}"
    howToFix: Split the API into several smaller documents or raise the maxOperations option.
    given: $
    resolved: false
    severity: info
    type: style
    then:
      function: extra-api-max-operations
      functionOptions:
        maxOperations: 40
  extra-api-symmetry-get-vs-write-schemas:
    description: Summary, Prototype and Patch variants of a resource schema must be graph fragments of its canonical schema.
    message: "{{error}}"
    howToFix: Remove the property from the variant, add it to the canonical schema, or give it the canonical type.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-api-symmetry-get-vs-write-schemas
      functionOptions: {}
  extra-api-version-in-url:
    description: The API must expose a version in a server URL, a path or a version header.
    message: "{{error}}"
    howToFix: Add a version segment such as /v1 to a server URL or path, or declare a version header.
    given: $
    resolved: false
    severity: info
    type: style
    then:
      function: extra-api-version-in-url
      functionOptions: {}
  extra-array-bounds-and-items-consistency:
    description: Array schemas must define items and should define consistent minItems and maxItems.
    message: "{{error}}"
    howToFix: Add an items schema and numeric minItems and maxItems with minItems not above maxItems.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-array-bounds-and-items-consistency
      functionOptions:
        requireBounds: true
  extra-array-parameter-serialization:
    description: Array parameters must declare both style and explode.
    message: "{{error}}"
    howToFix: Add style and explode to the array parameter so its serialization is explicit.
    given: $
    formats:
      - oas3
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-array-parameter-serialization
      functionOptions:
        in:
          - query
          - header
          - path
          - cookie
  extra-array-requires-items:
    description: Schemas of type array must define items.
    message: "{{error}}"
    howToFix: Add an items schema to the array schema.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-array-requires-items
      functionOptions:
        allowPrefixItems: true
  extra-avoid-inline-object-schemas:
    description: Object schemas must be defined in components/schemas and referenced instead of being inlined.
    message: "{{error}}"
    howToFix: Move the inline object schema to components/schemas and reference it with $ref.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-avoid-inline-object-schemas
      functionOptions:
        allowReferenceUnions: false
  extra-banned-words-in-docs:
    description: Descriptions, summaries and titles must not contain the configured banned words.
    message: "{{error}}"
    howToFix: Reword the text so that it no longer uses the banned word.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-banned-words-in-docs
      functionOptions: {}
  extra-boolean-parameter-prefix:
    description: Boolean parameter names must start with one of the configured prefixes.
    message: "{{error}}"
    howToFix: Rename the parameter so that it starts with an allowed prefix such as is or has.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-boolean-parameter-prefix
      functionOptions:
        prefixes:
          - is
          - has
  extra-collection-response-has-named-array:
    description: List operation responses must contain an array property named after the last path segment.
    message: "{{error}}"
    howToFix: Wrap the collection in an object whose array property is named after the last path segment.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-collection-response-has-named-array
      functionOptions:
        operationIdPrefix: list
  extra-component-name-max-length:
    description: Component names must not be longer than a maximum length.
    message: "{{error}}"
    howToFix: Rename the component to a shorter name and update the references to it.
    given: $
    resolved: false
    severity: info
    type: style
    then:
      function: extra-component-name-max-length
      functionOptions:
        maxLength: 50
  extra-component-schema-name-case:
    description: Component schema names must follow the configured case convention.
    message: "{{error}}"
    howToFix: Rename the schema to the configured case convention and update every $ref to it.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-component-schema-name-case
      functionOptions:
        casing:
          - PascalCase
        ignore: []
  extra-composition-branches-same-type:
    description: All leaf schemas of a oneOf, allOf, anyOf or not must have the same type.
    message: "{{error}}"
    howToFix: Make every branch of the composition declare the same type, or restructure the schema.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-composition-branches-same-type
      functionOptions: {}
  extra-consistent-property-name-and-type:
    description: Properties with the same name in different schemas must have the same type.
    message: "{{error}}"
    howToFix: Align the type of the property with its earlier declaration, or rename the property.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-consistent-property-name-and-type
      functionOptions: {}
  extra-content-must-have-schema:
    description: Every content entry of a request body, response or parameter must contain a schema.
    message: "{{error}}"
    howToFix: Add a schema to the media type object.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-content-must-have-schema
      functionOptions: {}
  extra-content-type-allow-list:
    description: Request and response media types must be in the allowed list.
    message: "{{error}}"
    howToFix: Use one of the allowed media types, or extend the mimetypes option.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-content-type-allow-list
      functionOptions:
        mimetypes:
          - application/json
        validateExamples: true
  extra-cors-origin-header:
    description: Every response must define the Access-Control-Allow-Origin header.
    message: "{{error}}"
    howToFix: Add the Access-Control-Allow-Origin header to the headers of the response.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-cors-origin-header
      functionOptions:
        header: Access-Control-Allow-Origin
  extra-date-named-property-must-use-date-format:
    description: Date-based schemas and properties must be strings with format date or date-time.
    message: "{{error}}"
    howToFix: Use type string with format date or date-time for the schema.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-date-named-property-must-use-date-format
      functionOptions:
        names: []
  extra-date-time-property-suffix:
    description: String properties with a date, time or date-time format must have a matching name.
    message: "{{error}}"
    howToFix: Rename the property so that it matches one of the configured name patterns.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-date-time-property-suffix
      functionOptions:
        patterns:
          - .+_at
          - (.+_)*time(stamp)?(_.+)?
          - (.+_)*date(_.+)*
          - (.+_)*day(_.+)*
  extra-deepobject-example-keys:
    description: Examples of deepObject query parameters must use keys defined by the parameter schema.
    message: "{{error}}"
    howToFix: Rename the example key to a property of the schema, or add the property to the schema.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-deepobject-example-keys
      functionOptions: {}
  extra-default-equals-example-redundant:
    description: A schema example must not be identical to the schema default.
    message: "{{error}}"
    howToFix: Remove the redundant example or replace it with a value that differs from the default.
    given: $
    resolved: false
    severity: info
    type: style
    then:
      function: extra-default-equals-example-redundant
      functionOptions: {}
  extra-description-usage-hint-wording:
    description: Operation descriptions should contain a usage hint word such as returns, allows or use.
    message: "{{error}}"
    howToFix: Reword the description to say what the operation returns, allows or is used for.
    given: $
    resolved: false
    severity: info
    type: style
    then:
      function: extra-description-usage-hint-wording
      functionOptions:
        hintWords:
          - use
          - call
          - returns
          - when
          - used to
          - allows
          - enables
          - provides
          - retrieves
          - creates
          - updates
          - deletes
        minLength: 30
  extra-discourage-http-422:
    description: Operations should use status code 400 instead of 422.
    message: "{{error}}"
    howToFix: Replace the 422 response with a 400 response.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-discourage-http-422
      functionOptions: {}
  extra-discriminator-property-exists:
    description: The property named by a discriminator must exist in the schema.
    message: "{{error}}"
    howToFix: Define the discriminator property in the schema, or change propertyName to an existing property.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-discriminator-property-exists
      functionOptions: {}
  extra-discriminator-property-required:
    description: The discriminator property must be listed in the required list of the schema.
    message: "{{error}}"
    howToFix: Add the discriminator property to the required list of the schema.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-discriminator-property-required
      functionOptions: {}
  extra-document-has-operations:
    description: The document must define at least one operation.
    message: "{{error}}"
    howToFix: Add an operation to paths, or lint the correct file.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-document-has-operations
      functionOptions: {}
  extra-empty-required-or-enum:
    description: The required and enum lists of a schema must be non-empty and free of duplicates.
    message: "{{error}}"
    howToFix: Remove the empty list or the duplicated entry.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-empty-required-or-enum
      functionOptions: {}
  extra-encoding-keys-match-properties:
    description: Encoding map keys must name properties of the media type schema.
    message: "{{error}}"
    howToFix: Rename or remove the encoding key so that it matches a property of the schema.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-encoding-keys-match-properties
      functionOptions: {}
  extra-enum-value-case:
    description: String enum values must follow the configured case convention, snake_case or SCREAMING_SNAKE_CASE by default.
    message: "{{error}}"
    howToFix: Rename the enum value to the configured case convention.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-enum-value-case
      functionOptions:
        casing:
          - snake_case
          - SCREAMING_SNAKE_CASE
  extra-error-container-schema-shape:
    description: Error response schemas must follow the API Handbook error container model.
    message: "{{error}}"
    howToFix: Make the error schema an object with trace and an errors array of error models with code, message and more_info.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-error-container-schema-shape
      functionOptions: {}
  extra-error-response-content-type:
    description: Error responses that define content must offer an application/json entry.
    message: "{{error}}"
    howToFix: Add an application/json entry to the content of the error response.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-error-response-content-type
      functionOptions: {}
  extra-error-response-has-body:
    description: 4xx responses must declare a response body with a schema.
    message: "{{error}}"
    howToFix: Add a content map with an error schema to the response.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-error-response-has-body
      functionOptions:
        requireSchema: true
  extra-etag-with-conditional-headers:
    description: A path item with If-Match or If-None-Match parameters must return an ETag header from GET.
    message: "{{error}}"
    howToFix: Declare an ETag response header on the 2xx responses of the GET operation.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-etag-with-conditional-headers
      functionOptions: {}
  extra-example-body-key-case:
    description: Property names in example bodies must follow the configured case style.
    message: "{{error}}"
    howToFix: Rename the example property so that it follows the configured case style.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-example-body-key-case
      functionOptions:
        casing:
          - snake_case
        ignoreKeys: []
  extra-example-value-xor-external:
    description: An Example Object must define exactly one of value and externalValue.
    message: "{{error}}"
    howToFix: Keep either value or externalValue in the example, not both and not neither.
    given: $
    formats:
      - oas3
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-example-value-xor-external
      functionOptions:
        forbidBoth: true
        requireOne: true
  extra-exploded-object-query-required-property:
    description: A required exploded object query parameter needs at least one required property.
    message: "{{error}}"
    howToFix: Add a required property to the object schema, set explode to false, or make the parameter optional.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-exploded-object-query-required-property
      functionOptions: {}
  extra-extensible-enum-string-type:
    description: Schemas with x-extensible-enum must have type string.
    message: "{{error}}"
    howToFix: "Declare type: string on the schema that carries x-extensible-enum."
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-extensible-enum-string-type
      functionOptions: {}
  extra-format-matches-type:
    description: Standard formats must be used with a compatible type.
    message: "{{error}}"
    howToFix: Change the type to one the format applies to, or use a different format.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-format-matches-type
      functionOptions: {}
  extra-global-security-required:
    description: The root security property must exist and hold at least one security requirement.
    message: "{{error}}"
    howToFix: Add a non-empty security list at the document root.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-global-security-required
      functionOptions: {}
  extra-header-name-max-length:
    description: Response header names must not exceed the maximum length.
    message: "{{error}}"
    howToFix: Shorten the response header name.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-header-name-max-length
      functionOptions:
        maxLength: 50
  extra-hoist-repeated-path-parameters:
    description: Identical path parameters repeated across operations must move to the path item.
    message: "{{error}}"
    howToFix: Declare the path parameter once in the parameters of the path item and remove it from the operations.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-hoist-repeated-path-parameters
      functionOptions: {}
  extra-ignored-header-names:
    description: Header parameters named Accept, Content-Type or Authorization are ignored.
    message: "{{error}}"
    howToFix: Remove the header and describe the media type with content and credentials with securitySchemes.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-ignored-header-names
      functionOptions:
        names:
          - Accept
          - Content-Type
          - Authorization
  extra-illogical-composition-keywords:
    description: allOf, anyOf and oneOf must combine schemas that a value can actually resolve against.
    message: "{{error}}"
    howToFix: Give the composition at least two distinct, non-empty, mutually exclusive members, or use the schema directly.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-illogical-composition-keywords
      functionOptions: {}
  extra-integer-bounds-in-format-range:
    description: Integer schemas must define an int32 or int64 format and bounds inside its range.
    message: "{{error}}"
    howToFix: Add format int32 or int64 and minimum and maximum values within the range of the format.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-integer-bounds-in-format-range
      functionOptions:
        requireBounds: true
        requireFormat: true
  extra-link-parameter-exists:
    description: Links must identify an existing operation and use parameters that exist in it.
    message: "{{error}}"
    howToFix: Give the link exactly one valid operationId or operationRef and rename its parameters to match the target operation.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-link-parameter-exists
      functionOptions:
        reportRemoteOperationRef: true
  extra-link-target-exists:
    description: Link objects must reference an operation that exists in the document.
    message: "{{error}}"
    howToFix: Point the link at an existing operationId or at a valid relative operationRef.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-link-target-exists
      functionOptions:
        operationRefMethods: []
  extra-major-version-in-path:
    description: The major version must be a v<n> segment in a server URL or at the start of every path.
    message: "{{error}}"
    howToFix: Add a version segment such as /v1 to the server URL or to the start of every path.
    given: $
    formats:
      - oas3
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-major-version-in-path
      functionOptions:
        allowServerVersion: true
        consistent: true
  extra-media-type-allow-list:
    description: Media types must be in the configured allow-list.
    message: "{{error}}"
    howToFix: Use one of the allowed media types or extend the allowed option.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-media-type-allow-list
      functionOptions:
        allowed: []
        includeResponses: false
  extra-merge-patch-no-required:
    description: Schemas of merge patch request bodies must not define required properties.
    message: "{{error}}"
    howToFix: Remove required from the schema, or use a separate schema for the merge patch request.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-merge-patch-no-required
      functionOptions: {}
  extra-multiple-path-params:
    description: Paths should not contain more than one path parameter.
    message: "{{error}}"
    howToFix: Address the nested resource through its own root path, or raise the max option.
    given: $
    resolved: false
    severity: info
    type: style
    then:
      function: extra-multiple-path-params
      functionOptions:
        max: 1
  extra-no-array-of-arrays:
    description: Array schemas must not use another array schema as their items.
    message: "{{error}}"
    howToFix: Wrap the inner array in an object schema.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-no-array-of-arrays
      functionOptions: {}
  extra-no-binary-in-json-api:
    description: Binary string schemas must not be used for parameters or JSON request and response bodies.
    message: "{{error}}"
    howToFix: Use a non-JSON media type for binary data, or encode the value as a base64 string with format byte.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-no-binary-in-json-api
      functionOptions: {}
  extra-no-body-on-safe-methods:
    description: Operations with a method such as GET, HEAD, DELETE or OPTIONS must not define a request body.
    message: "{{error}}"
    howToFix: Remove the requestBody, or move its data into parameters.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-no-body-on-safe-methods
      functionOptions:
        httpMethods:
          - delete
          - get
          - head
          - options
  extra-no-circular-schema-refs:
    description: Component schemas must not reference themselves through $ref cycles.
    message: "{{error}}"
    howToFix: Break the cycle, for example by referencing the related resource by identifier.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-no-circular-schema-refs
      functionOptions:
        ignoreProperties: false
  extra-no-consecutive-path-parameter-segments:
    description: A path must not contain two consecutive path parameter segments.
    message: "{{error}}"
    howToFix: Add a resource name segment between the two path parameters.
    given: $
    resolved: false
    severity: warn
    type: style
    then:
      function: extra-no-consecutive-path-parameter-segments
      functionOptions: {}
  extra-no-default-for-required-parameter:
    description: A required parameter must not have a default value.
    message: "{{error}}"
    howToFix: Remove the default, or make the parameter optional.
    given: $
    resolved: false
    severity: warn
    type: validation
    then:
      function: extra-no-default-for-required-parameter
      functionOptions:
        onlyTruthy: false
  extra-no-eval-in-title:
    description: Titles and descriptions must not contain eval(.
    message: "{{error}}"
    howToFix: Remove the eval( text from the title or description.
    given: $
    resolved: false
    severity: error
    type: validation
    then:
      function: extra-no-eval-in-title
      functionOptions: {}
  extra-no-inline-schema:
    description: Parameter, request body and response schemas must be $refs to reusable schemas.
    message: "{{error}}"
    howToFix: Move the inline schema to components/schemas and reference it with $ref.
    given: $
    resolved: false
    severity: info
    type: style
    then:
      function: extra-no-inline-schema
      functionOptions:
        allowPrimitives: false
        parameters: true
        requestBodies: true
        responses: true
