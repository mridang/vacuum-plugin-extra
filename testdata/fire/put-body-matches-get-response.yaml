openapi: 3.0.3
info:
  title: Test
  version: "1.0"
paths:
  /pets/{id}:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "200":
          description: ok
components:
  schemas:
    Pet:
      type: object
      properties:
        name: { type: string }
        id: { type: integer }
    NewPet:
      type: object
      properties:
        name: { type: string }
