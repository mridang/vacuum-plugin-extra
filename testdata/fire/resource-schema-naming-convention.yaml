openapi: 3.0.3
info:
  title: Test
  version: "1.0"
paths:
  /pets:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetCollection"
  /pets/{pet_id}:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
    PetCollection:
      type: object
      properties:
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Animal"
    Animal:
      type: object
