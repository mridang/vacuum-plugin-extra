name: Release to Github

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

defaults:
  run:
    working-directory: ./

env:
  GONOSUMDB: github.com/mridang/vacuum-plugin-extra/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ github.workflow }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ github.workflow }}-${{ runner.os }}-

      - name: Run tests
        run: go test ./...

      # Multi-platform `docker buildx build` (run internally by
      # @mridang/semantic-release-oci) needs a container-driver builder; the
      # default docker driver cannot emit a multi-arch manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run semantic-release
        uses: mridang/action-semantic-release@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # @mridang/semantic-release-oci performs `docker login` itself using
          # these; no separate docker/login-action step is needed.
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
